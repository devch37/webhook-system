spring:
  application:
    name: webhook
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/webhook.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-request-size: 1MB
      max-file-size: 1MB
  web:
    resources:
      add-mappings: false

webhook:
  secret: ${WEBHOOK_SECRET:your-secret-key-replace-this-value}
  signature:
    max-age-minutes: 15  # Replay Attack 방지 유효 시간 (분)

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
